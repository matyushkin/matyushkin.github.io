  <script>
  const TERMS = [
    { term: 'LLM', group: 'foundations', priority: 10, ru: 'Большая языковая модель, которая генерирует текст, код или структурированный ответ по контексту и инструкции.', en: 'A large language model that generates text, code, or structured output from context and instructions.' },
    { term: 'Prompt', group: 'foundations', priority: 20, ru: 'Инструкция и контекст, которые подаются модели. Prompt может включать роль, данные, формат ответа, constraints и examples.', en: 'The instruction and context given to a model. A prompt can include role, data, output format, constraints, and examples.' },
    { term: 'Context window', group: 'foundations', priority: 30, ru: 'Максимальный объем tokens, который модель может учитывать в одном запросе: system prompt, history, документы, tool results и ответ.', en: 'The maximum token budget a model can consider in one request: system prompt, history, documents, tool results, and output.' },
    { term: 'Token', group: 'foundations', priority: 40, ru: 'Единица текста для модели. Стоимость, лимиты и context window обычно считаются в tokens, а не в символах.', en: 'A model text unit. Cost, limits, and context windows are usually counted in tokens, not characters.' },
    { term: 'Embedding', group: 'foundations', priority: 50, ru: 'Векторное представление текста, изображения или другого объекта, используемое для поиска похожих фрагментов и clustering.', en: 'A vector representation of text, image, or another object used for similarity search and clustering.' },
    { term: 'Fine-tuning', group: 'foundations', priority: 60, ru: 'Дообучение модели на дополнительных примерах. Обычно нужно для устойчивого стиля, формата или узкой domain-поведенческой настройки.', en: 'Additional training on examples. Usually useful for stable style, format, or narrow domain behavior.' },
    { term: 'Quantization', group: 'foundations', priority: 70, ru: 'Сжатие весов модели до меньшей точности, чтобы снизить memory use и ускорить локальный запуск, иногда ценой качества.', en: 'Reducing model weight precision to lower memory use and speed local inference, sometimes at a quality cost.' },

    { term: 'Agent', group: 'agents', priority: 10, ru: 'LLM-система, которая не только отвечает, но и выбирает действия: вызывает tools, читает состояние, планирует шаги и останавливается по условию.', en: 'An LLM system that can choose actions: call tools, read state, plan steps, and stop by a condition.' },
    { term: 'Agent loop', group: 'agents', priority: 20, ru: 'Цикл observe-plan-act-check: агент получает состояние, решает следующий шаг, выполняет действие и проверяет результат.', en: 'The observe-plan-act-check cycle: the agent reads state, chooses a next step, acts, and checks the result.' },
    { term: 'Tool calling', group: 'agents', priority: 30, ru: 'Способ дать модели структурированный выбор функции и аргументов, вместо просьбы написать произвольный JSON в тексте.', en: 'A way to let a model choose a structured function and arguments instead of free-form JSON in text.' },
    { term: 'Function calling', group: 'agents', priority: 40, ru: 'Частный случай tool calling, где модель выбирает функцию из заданной schema и возвращает структурированные arguments.', en: 'A type of tool calling where the model chooses a function from a schema and returns structured arguments.' },
    { term: 'Planning', group: 'agents', priority: 50, ru: 'Шаг, где агент явно или неявно выбирает порядок действий. В production план должен быть проверяемым и ограниченным.', en: 'The step where an agent explicitly or implicitly chooses action order. In production, plans should be checkable and constrained.' },
    { term: 'Memory', group: 'agents', priority: 60, ru: 'Состояние, которое переживает один запрос: profile, facts, preferences, summaries, retrieved context или task state.', en: 'State that survives one request: profile, facts, preferences, summaries, retrieved context, or task state.' },
    { term: 'Human-in-the-loop', group: 'agents', priority: 70, ru: 'Механизм, где человек подтверждает, редактирует или отклоняет рискованные шаги агента до выполнения.', en: 'A mechanism where a person approves, edits, or rejects risky agent steps before execution.' },
    { term: 'Sandbox', group: 'agents', priority: 80, ru: 'Ограниченная среда выполнения для агента или tool: доступ к файлам, сети, shell и secrets задается явно.', en: 'A constrained execution environment for an agent or tool: file, network, shell, and secret access is explicit.' },
    { term: 'Guardrail', group: 'agents', priority: 90, ru: 'Правило или проверка, ограничивающая ввод, вывод или действие агента: policy, classifier, schema, approval или deterministic check.', en: 'A rule or check that constrains an agent input, output, or action: policy, classifier, schema, approval, or deterministic check.' },

    { term: 'RAG', group: 'rag', priority: 10, ru: 'Retrieval-augmented generation: система сначала достает релевантные документы, затем отвечает с опорой на найденный контекст.', en: 'Retrieval-augmented generation: retrieve relevant documents first, then answer using that context.' },
    { term: 'Retriever', group: 'rag', priority: 20, ru: 'Компонент, который выбирает документы или chunks для ответа: vector search, keyword search, hybrid search или reranked results.', en: 'The component that selects documents or chunks for an answer: vector search, keyword search, hybrid search, or reranked results.' },
    { term: 'Chunking', group: 'rag', priority: 30, ru: 'Разбиение документов на фрагменты. Размер и границы chunks сильно влияют на retrieval quality и citation quality.', en: 'Splitting documents into pieces. Chunk size and boundaries strongly affect retrieval and citation quality.' },
    { term: 'Vector database', group: 'rag', priority: 40, ru: 'Хранилище embeddings с поиском похожих векторов и metadata filters.', en: 'A store for embeddings with similar-vector search and metadata filters.' },
    { term: 'Hybrid search', group: 'rag', priority: 50, ru: 'Поиск, совмещающий dense vector similarity и lexical/keyword matching, часто с последующим reranking.', en: 'Search that combines dense vector similarity with lexical or keyword matching, often followed by reranking.' },
    { term: 'Reranker', group: 'rag', priority: 60, ru: 'Модель или алгоритм, который переупорядочивает кандидаты retrieval перед передачей контекста LLM.', en: 'A model or algorithm that reorders retrieval candidates before passing context to the LLM.' },
    { term: 'Citation', group: 'rag', priority: 70, ru: 'Проверяемая ссылка на источник ответа: документ, section, URL, строка или chunk id.', en: 'A verifiable source pointer for an answer: document, section, URL, line, or chunk id.' },

    { term: 'Harness', group: 'evals', priority: 10, ru: 'Обвязка для запуска модели или агента в повторяемом сценарии: inputs, tools, assertions, scoring и logs.', en: 'A wrapper for running a model or agent in a repeatable scenario: inputs, tools, assertions, scoring, and logs.' },
    { term: 'Eval', group: 'evals', priority: 20, ru: 'Проверка качества на наборе задач. Хороший eval отделяет model failure, tool failure и ошибку самого harness.', en: 'A quality check on a task set. A good eval separates model failure, tool failure, and harness failure.' },
    { term: 'Benchmark', group: 'evals', priority: 30, ru: 'Стандартизированный набор задач и метрик для сравнения моделей, scaffolds или систем.', en: 'A standardized task and metric set for comparing models, scaffolds, or systems.' },
    { term: 'Regression set', group: 'evals', priority: 40, ru: 'Набор примеров, который должен продолжать проходить после смены модели, prompt, schema или tool implementation.', en: 'A set of examples that should keep passing after a model, prompt, schema, or tool implementation changes.' },
    { term: 'Golden dataset', group: 'evals', priority: 50, ru: 'Проверенный набор inputs и expected outputs, используемый как эталон для release gates и сравнения изменений.', en: 'A reviewed set of inputs and expected outputs used as a reference for release gates and change comparison.' },
    { term: 'Model-graded eval', group: 'evals', priority: 60, ru: 'Eval, где другая модель оценивает ответ. Требует calibration, spot checks и защиты от bias.', en: 'An eval where another model grades the answer. It needs calibration, spot checks, and bias controls.' },
    { term: 'SWE-bench', group: 'evals', priority: 70, ru: 'Benchmark для software engineering agents на реальных GitHub issues и repository-level fixes.', en: 'A benchmark for software engineering agents on real GitHub issues and repository-level fixes.' },
    { term: 'BFCL', group: 'evals', priority: 80, ru: 'Berkeley Function Calling Leaderboard: benchmark для function/tool calling, включая multi-turn и agentic cases.', en: 'Berkeley Function Calling Leaderboard: a benchmark for function/tool calling, including multi-turn and agentic cases.' },

    { term: 'MCP', group: 'protocols', priority: 10, ru: 'Model Context Protocol: протокол подключения LLM clients к tool/data servers через единый интерфейс.', en: 'Model Context Protocol: a protocol for connecting LLM clients to tool and data servers through a common interface.' },
    { term: 'Tool server', group: 'protocols', priority: 20, ru: 'Сервис, который предоставляет tools/resources агенту или LLM client через API или protocol вроде MCP.', en: 'A service that exposes tools or resources to an agent or LLM client through an API or protocol such as MCP.' },
    { term: 'Resource', group: 'protocols', priority: 30, ru: 'Читаемый объект, который tool server может дать модели: файл, документ, database record, issue, calendar event.', en: 'A readable object a tool server can provide to a model: file, document, database record, issue, or calendar event.' },
    { term: 'Permission boundary', group: 'protocols', priority: 40, ru: 'Граница того, что агенту разрешено читать, изменять или отправлять во внешние системы.', en: 'The boundary of what an agent may read, change, or send to external systems.' },
    { term: 'Prompt injection', group: 'protocols', priority: 50, ru: 'Атака или сбой, где внешние данные содержат инструкции, пытающиеся изменить поведение модели или tools.', en: 'An attack or failure where external data contains instructions that try to change model or tool behavior.' },
    { term: 'Observability', group: 'protocols', priority: 60, ru: 'Трассировка prompts, tool calls, latency, errors, costs и decisions, чтобы runs можно было debug/replay.', en: 'Tracing prompts, tool calls, latency, errors, costs, and decisions so runs can be debugged or replayed.' },
    { term: 'Trace', group: 'protocols', priority: 70, ru: 'Запись одного run: входы, сообщения, tool calls, outputs, timing, ошибки и metadata.', en: 'A record of one run: inputs, messages, tool calls, outputs, timing, errors, and metadata.' },

    { term: 'Local runtime', group: 'local', priority: 10, ru: 'Среда запуска open-weight моделей на локальной машине или сервере: Ollama, LM Studio, llama.cpp, vLLM и похожие инструменты.', en: 'A runtime for open-weight models on a local machine or server: Ollama, LM Studio, llama.cpp, vLLM, and similar tools.' },
    { term: 'Open-weight model', group: 'local', priority: 20, ru: 'Модель, веса которой доступны для скачивания и запуска, но лицензия может ограничивать использование.', en: 'A model whose weights can be downloaded and run, though the license may still restrict use.' },
    { term: 'Inference server', group: 'local', priority: 30, ru: 'Сервер, который принимает запросы к модели и возвращает completions, embeddings или tool-call outputs.', en: 'A server that accepts model requests and returns completions, embeddings, or tool-call outputs.' },
    { term: 'GGUF', group: 'local', priority: 40, ru: 'Формат модели, часто используемый llama.cpp и локальными runtimes для quantized open-weight моделей.', en: 'A model format commonly used by llama.cpp and local runtimes for quantized open-weight models.' },
    { term: 'Tokens per second', group: 'local', priority: 50, ru: 'Практическая метрика скорости генерации локальной или удаленной модели.', en: 'A practical speed metric for local or remote model generation.' },

    { term: 'Freshness policy', group: 'operations', priority: 10, ru: 'Правило актуальности справочника: дата проверки, официальный источник и статус stable, moving fast, deprecated или watchlist.', en: 'A freshness rule for the cookbook: verification date, official source, and status such as stable, moving fast, deprecated, or watchlist.' },
    { term: 'Stable', group: 'operations', priority: 20, ru: 'Статус источника или инструмента, где концепция и ссылки меняются медленно и достаточно периодической проверки.', en: 'A status for a source or tool whose concept and links change slowly enough for periodic review.' },
    { term: 'Moving fast', group: 'operations', priority: 30, ru: 'Статус для быстро меняющихся API, tools, pricing, security model или product surface.', en: 'A status for fast-changing APIs, tools, pricing, security models, or product surfaces.' },
    { term: 'Deprecated', group: 'operations', priority: 40, ru: 'Статус для инструмента или API, который заменяется новым направлением и нужен в основном для legacy контекста.', en: 'A status for a tool or API being replaced by a newer direction and mostly useful for legacy context.' },
    { term: 'Watchlist', group: 'operations', priority: 50, ru: 'Статус для темы, где источник, ownership, maturity или безопасность требуют ручной перепроверки.', en: 'A status for a topic where source, ownership, maturity, or safety needs manual rechecking.' }
  ];

  const GROUPS = {
    foundations: { ru: 'Базовые понятия', en: 'Foundations', order: 10 },
    agents: { ru: 'Агенты и tools', en: 'Agents and tools', order: 20 },
    rag: { ru: 'RAG и retrieval', en: 'RAG and retrieval', order: 30 },
    evals: { ru: 'Evals и benchmarks', en: 'Evals and benchmarks', order: 40 },
    protocols: { ru: 'Протоколы и безопасность', en: 'Protocols and security', order: 50 },
    local: { ru: 'Локальный запуск', en: 'Local runtimes', order: 60 },
    operations: { ru: 'Операционная актуальность', en: 'Operational freshness', order: 70 }
  };

  const UI = {
    ru: {
      title: 'Глоссарий AI Cookbook',
      lead: 'Короткие рабочие определения терминов, которые часто путаются в LLM и агентских системах.',
      termsTitle: 'Термины',
      controlsTitle: 'Поиск и порядок',
      searchLabel: 'Поиск',
      searchPlaceholder: 'RAG, sandbox, benchmark...',
      sortLabel: 'Порядок',
      sortPriority: 'Частые сначала',
      sortAlphabetical: 'По алфавиту',
      count: one => one === 1 ? '1 термин' : `${one} терминов`,
      noResults: 'Термин не найден.',
      back: 'Назад к AI Cookbook',
      nav: { art: 'Искусство', science: 'Наука', technology: 'Технологии' },
      footer: 'Почта — <a href="mailto:leva.matyushkin@gmail.com">leva.matyushkin@gmail.com</a>'
    },
    en: {
      title: 'AI Cookbook Glossary',
      lead: 'Short working definitions for terms that are often conflated in LLM and agent systems.',
      termsTitle: 'Terms',
      controlsTitle: 'Search and order',
      searchLabel: 'Search',
      searchPlaceholder: 'RAG, sandbox, benchmark...',
      sortLabel: 'Order',
      sortPriority: 'Common first',
      sortAlphabetical: 'Alphabetical',
      count: one => one === 1 ? '1 term' : `${one} terms`,
      noResults: 'No term found.',
      back: 'Back to AI Cookbook',
      nav: { art: 'Art', science: 'Science', technology: 'Technology' },
      footer: 'Email — <a href="mailto:leva.matyushkin@gmail.com">leva.matyushkin@gmail.com</a>'
    }
  };

  function getLang() {
    const urlLang = new URLSearchParams(window.location.search).get('lang');
    if (urlLang) { localStorage.setItem('lang', urlLang); return urlLang; }
    return localStorage.getItem('lang') || ((navigator.language || '').slice(0, 2).toLowerCase() === 'ru' ? 'ru' : 'en');
  }

  function setNav(ui) {
    const navArt = document.getElementById('nav-art');
    const navSci = document.getElementById('nav-science');
    const navTech = document.getElementById('nav-technology');
    if (navArt) { navArt.textContent = ui.nav.art; navArt.removeAttribute('aria-current'); }
    if (navSci) { navSci.textContent = ui.nav.science; navSci.removeAttribute('aria-current'); }
    if (navTech) { navTech.textContent = ui.nav.technology; navTech.setAttribute('aria-current', 'page'); }
  }

  function render(lang) {
    const ui = UI[lang] || UI.en;
    document.documentElement.lang = lang;
    document.title = ui.title + ' — Leo Matyushkin';
    document.getElementById('page-title').textContent = ui.title;
    document.getElementById('page-lead').textContent = ui.lead;
    document.getElementById('terms-title').textContent = ui.termsTitle;
    document.getElementById('glossary-controls-title').textContent = ui.controlsTitle;
    document.getElementById('search-label').textContent = ui.searchLabel;
    document.getElementById('glossary-search').placeholder = ui.searchPlaceholder;
    document.getElementById('sort-label').textContent = ui.sortLabel;
    document.getElementById('sort-priority').textContent = ui.sortPriority;
    document.getElementById('sort-alphabetical').textContent = ui.sortAlphabetical;
    document.getElementById('back-link').textContent = ui.back;
    document.getElementById('footer-text').innerHTML = ui.footer;
    setNav(ui);
    renderTerms(lang);
  }

  function termMatches(item, lang, query) {
    if (!query) return true;
    const group = GROUPS[item.group];
    return [
      item.term,
      item.ru,
      item.en,
      group?.ru,
      group?.en
    ].join(' ').toLowerCase().includes(query);
  }

  function sortedTerms(lang, query, sortMode) {
    const collator = new Intl.Collator(lang);
    const filtered = TERMS.filter(item => termMatches(item, lang, query));
    if (sortMode === 'alphabetical') {
      return filtered.sort((a, b) => collator.compare(a.term, b.term));
    }
    return filtered.sort((a, b) => {
      const groupDelta = (GROUPS[a.group]?.order || 999) - (GROUPS[b.group]?.order || 999);
      if (groupDelta) return groupDelta;
      return (a.priority || 999) - (b.priority || 999) || collator.compare(a.term, b.term);
    });
  }

  function renderTermCard(item, lang) {
    const article = document.createElement('article');
    article.className = 'cookbook-entry glossary-term';
    article.id = item.term.toLowerCase().replace(/[^a-z0-9]+/g, '-');
    const meta = document.createElement('p');
    meta.className = 'cookbook-entry-meta';
    const group = GROUPS[item.group];
    meta.appendChild(document.createElement('span'));
    meta.firstChild.textContent = group?.[lang] || group?.en || item.group;
    const heading = document.createElement('h3');
    heading.className = 'cookbook-entry-title';
    heading.textContent = item.term;
    const description = document.createElement('p');
    description.textContent = item[lang] || item.en;
    article.append(heading, meta, description);
    return article;
  }

  function renderTerms(lang) {
    const ui = UI[lang] || UI.en;
    const list = document.getElementById('glossary-list');
    const search = document.getElementById('glossary-search');
    const sort = document.getElementById('sort-mode');
    const query = (search?.value || '').trim().toLowerCase();
    const sortMode = sort?.value || 'priority';
    const terms = sortedTerms(lang, query, sortMode);
    document.getElementById('glossary-count').textContent = ui.count(terms.length);
    list.replaceChildren();
    if (!terms.length) {
      const empty = document.createElement('p');
      empty.className = 'cookbook-empty';
      empty.textContent = ui.noResults;
      list.appendChild(empty);
      return;
    }
    if (sortMode === 'alphabetical' || query) {
      terms.forEach(item => list.appendChild(renderTermCard(item, lang)));
      return;
    }
    Object.keys(GROUPS)
      .sort((a, b) => GROUPS[a].order - GROUPS[b].order)
      .forEach(groupId => {
        const groupTerms = terms.filter(item => item.group === groupId);
        if (!groupTerms.length) return;
        const section = document.createElement('section');
        section.className = 'glossary-group';
        const heading = document.createElement('h3');
        heading.textContent = GROUPS[groupId][lang] || GROUPS[groupId].en;
        section.appendChild(heading);
        groupTerms.forEach(item => section.appendChild(renderTermCard(item, lang)));
        list.appendChild(section);
      });
  }

  let lang = getLang();
  const select = document.getElementById('lang-select');
  select.value = lang;
  render(lang);
  document.getElementById('glossary-search').addEventListener('input', () => renderTerms(lang));
  document.getElementById('sort-mode').addEventListener('change', () => renderTerms(lang));
  select.addEventListener('change', () => {
    lang = select.value;
    localStorage.setItem('lang', lang);
    const url = new URL(window.location);
    url.searchParams.set('lang', lang);
    history.replaceState(null, '', url);
    render(lang);
  });

  (function() {
    const body = document.body;
    const saved = localStorage.getItem('theme');
    if (saved) { body.className = saved; }
    (function(){ var m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = body.classList.contains('dark-theme') ? '#1a1a1a' : '#ffffff'; })();
    const btn = document.querySelector('.theme-button');
    if (btn) btn.onclick = function() {
      const dark = body.classList.contains('dark-theme');
      body.classList.toggle('light-theme', dark);
      body.classList.toggle('dark-theme', !dark);
      localStorage.setItem('theme', body.className);
      var m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = !dark ? '#1a1a1a' : '#ffffff';
    };
  })();
  </script>
</body>
</html>
