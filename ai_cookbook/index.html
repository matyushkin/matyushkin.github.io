  <script>
  const UI = {
    ru: {
      pageTitle: 'AI Cookbook',
      kicker: 'Справочник по LLM и агентам',
      lead: 'Живой справочник по LLM, agent frameworks, локальному запуску, coding agents, harnesses, evals и протоколам. Главная страница — карта разделов; фильтруемый список вынесен в каталог.',
      sectionsTitle: 'Разделы',
      mapTitle: 'Карта области',
      recipesTitle: 'Рецепты',
      recipesLead: 'Сценарии, с которых удобно начинать: каждый рецепт связывает инструменты, порядок внедрения и проверку результата.',
      rankingsTitle: 'Evidence-backed рейтинги',
      rankingsLead: 'Оценки сделаны по конкретным сценариям и критериям. Это не общий рейтинг популярности.',
      methodologyTitle: 'Методология оценок',
      methodologyLead: 'Чтобы рейтинг можно было оспорить и улучшить, каждая оценка привязана к сценарию, evidence и cadence перепроверки.',
      roadmapTitle: 'Что развивать дальше',
      labels: {
        tools: 'Инструменты',
        steps: 'Порядок',
        checks: 'Проверки',
        scenario: 'Сценарий',
        criteria: 'Критерии',
        evidence: 'Почему',
        score: 'Оценка',
        rubric: 'Рубрика',
        cadence: 'Cadence проверки',
        sources: 'Источники'
      },
      hub: [
        { href: 'glossary/index.html', title: 'Глоссарий', description: 'Короткие определения терминов: harness, agent loop, RAG, MCP, eval и другие.' },
        { href: 'catalog/index.html', title: 'Каталог', description: 'Фильтруемый список инструментов: модели, runtimes, frameworks, agents, evals и protocols.' },
        { href: 'tools/langgraph/index.html', title: 'Глубокие страницы', description: 'Длинные страницы по LangGraph, LlamaIndex, OpenHands, MCP, Ollama и coding agents.' }
      ],
      nav: { art: 'Искусство', science: 'Наука', technology: 'Технологии' },
      footer: 'Почта — <a href="mailto:leva.matyushkin@gmail.com">leva.matyushkin@gmail.com</a> · <a href="/feed.xml">Лента обновлений</a>'
    },
    en: {
      pageTitle: 'AI Cookbook',
      kicker: 'LLM and agents encyclopedia',
      lead: 'A living encyclopedia of LLMs, agent frameworks, local runtimes, coding agents, harnesses, evals, and protocols. This overview is the map; the searchable list lives in the catalog.',
      sectionsTitle: 'Sections',
      mapTitle: 'Domain Map',
      recipesTitle: 'Recipes',
      recipesLead: 'Starting scenarios: each recipe connects tools, rollout order, and result checks.',
      rankingsTitle: 'Evidence-Backed Rankings',
      rankingsLead: 'Scores are scenario-based and criterion-based. This is not a generic popularity ranking.',
      methodologyTitle: 'Scoring Methodology',
      methodologyLead: 'Every score should be easy to challenge and improve: it is tied to a scenario, evidence, and review cadence.',
      roadmapTitle: 'Next development',
      labels: {
        tools: 'Tools',
        steps: 'Order',
        checks: 'Checks',
        scenario: 'Scenario',
        criteria: 'Criteria',
        evidence: 'Why',
        score: 'Score',
        rubric: 'Rubric',
        cadence: 'Review cadence',
        sources: 'Sources'
      },
      hub: [
        { href: 'glossary/index.html', title: 'Glossary', description: 'Short definitions for terms such as harness, agent loop, RAG, MCP, and eval.' },
        { href: 'catalog/index.html', title: 'Catalog', description: 'Searchable tool list: models, runtimes, frameworks, agents, evals, and protocols.' },
        { href: 'tools/langgraph/index.html', title: 'Deep pages', description: 'Long pages for LangGraph, LlamaIndex, OpenHands, MCP, Ollama, and coding agents.' }
      ],
      nav: { art: 'Art', science: 'Science', technology: 'Technology' },
      footer: 'Email — <a href="mailto:leva.matyushkin@gmail.com">leva.matyushkin@gmail.com</a> · <a href="/feed.xml">Updates feed</a>'
    }
  };

  function getLang() {
    const urlLang = new URLSearchParams(window.location.search).get('lang');
    if (urlLang) { localStorage.setItem('lang', urlLang); return urlLang; }
    const stored = localStorage.getItem('lang');
    if (stored) return stored;
    return (navigator.language || '').slice(0, 2).toLowerCase() === 'ru' ? 'ru' : 'en';
  }

  function text(value, lang) {
    if (!value) return '';
    if (typeof value === 'string') return value;
    return value[lang] || value.en || value.ru || '';
  }

  function el(tag, className, content) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (content !== undefined) node.textContent = content;
    return node;
  }

  function setNav(ui) {
    const navArt = document.getElementById('nav-art');
    const navSci = document.getElementById('nav-science');
    const navTech = document.getElementById('nav-technology');
    if (navArt) { navArt.textContent = ui.nav.art; navArt.removeAttribute('aria-current'); }
    if (navSci) { navSci.textContent = ui.nav.science; navSci.removeAttribute('aria-current'); }
    if (navTech) { navTech.textContent = ui.nav.technology; navTech.setAttribute('aria-current', 'page'); }
  }

  function applyStaticText(lang) {
    const ui = UI[lang] || UI.en;
    document.documentElement.lang = lang;
    document.title = ui.pageTitle + ' — Leo Matyushkin';
    document.getElementById('page-kicker').textContent = ui.kicker;
    document.getElementById('page-title').textContent = ui.pageTitle;
    document.getElementById('page-lead').textContent = ui.lead;
    document.getElementById('sections-title').textContent = ui.sectionsTitle;
    document.getElementById('map-title').textContent = ui.mapTitle;
    document.getElementById('recipes-title').textContent = ui.recipesTitle;
    document.getElementById('recipes-lead').textContent = ui.recipesLead;
    document.getElementById('rankings-title').textContent = ui.rankingsTitle;
    document.getElementById('rankings-lead').textContent = ui.rankingsLead;
    document.getElementById('methodology-title').textContent = ui.methodologyTitle;
    document.getElementById('methodology-lead').textContent = ui.methodologyLead;
    document.getElementById('roadmap-title').textContent = ui.roadmapTitle;
    document.getElementById('footer-text').innerHTML = ui.footer;
    setNav(ui);
  }

  function listBlock(label, values) {
    const wrapper = el('div', 'cookbook-entry-block');
    wrapper.appendChild(el('strong', '', label));
    const list = el('ul', '');
    values.forEach(value => list.appendChild(el('li', '', value)));
    wrapper.appendChild(list);
    return wrapper;
  }

  function renderHub(lang) {
    const ui = UI[lang] || UI.en;
    const hub = document.getElementById('hub-links');
    hub.replaceChildren();
    ui.hub.forEach(item => {
      const card = el('article', 'cookbook-hub-card');
      const title = el('h3', '');
      const link = document.createElement('a');
      link.href = item.href;
      link.textContent = item.title;
      title.appendChild(link);
      card.append(title, el('p', '', item.description));
      hub.appendChild(card);
    });
  }

  function renderMap(data, lang) {
    const map = document.getElementById('category-map');
    map.replaceChildren();
    data.categories.forEach(category => {
      const entries = data.entries.filter(entry => entry.category === category.id);
      const card = el('article', 'cookbook-map-item');
      card.append(
        el('h3', '', text(category.title, lang)),
        el('p', '', text(category.description, lang)),
        el('p', 'cookbook-map-count', entries.length.toString())
      );
      map.appendChild(card);
    });
  }

  function titleForEntry(data, entryId) {
    return data.entries.find(entry => entry.id === entryId)?.title || entryId;
  }

  function renderRecipes(data, lang) {
    const ui = UI[lang] || UI.en;
    const list = document.getElementById('recipes-list');
    list.replaceChildren();
    data.recipes.slice(0, 3).forEach(recipe => {
      const article = el('article', 'cookbook-recipe');
      article.id = recipe.id;
      article.appendChild(el('h3', '', text(recipe.title, lang)));
      article.appendChild(el('p', '', text(recipe.goal, lang)));
      const tools = el('p', 'cookbook-recipe-tools');
      tools.appendChild(el('strong', '', `${ui.labels.tools}: `));
      recipe.tools.forEach((toolId, index) => {
        if (index > 0) tools.appendChild(document.createTextNode(' · '));
        const link = document.createElement('a');
        link.href = `catalog/index.html#${toolId}`;
        link.textContent = titleForEntry(data, toolId);
        tools.appendChild(link);
      });
      article.append(
        tools,
        listBlock(ui.labels.steps, recipe.steps?.[lang] || []),
        listBlock(ui.labels.checks, recipe.checks?.[lang] || [])
      );
      list.appendChild(article);
    });
  }

  function renderRankings(data, lang) {
    const ui = UI[lang] || UI.en;
    const rankings = document.getElementById('rankings-list');
    rankings.replaceChildren();
    data.rankings.forEach(ranking => {
      const article = el('article', 'cookbook-ranking');
      article.id = `ranking-${ranking.id}`;
      article.appendChild(el('h3', '', text(ranking.title, lang)));
      const scenario = el('p', '');
      scenario.append(el('strong', '', `${ui.labels.scenario}: `), document.createTextNode(text(ranking.scenario, lang)));
      article.appendChild(scenario);
      const tableWrap = el('div', 'cookbook-table-wrap');
      const table = el('table', 'cookbook-ranking-table');
      const thead = document.createElement('thead');
      const headRow = document.createElement('tr');
      [ui.labels.tools, ui.labels.score, ui.labels.evidence].forEach(label => headRow.appendChild(el('th', '', label)));
      thead.appendChild(headRow);
      const tbody = document.createElement('tbody');
      ranking.items.slice(0, 3).forEach(item => {
        const entry = data.entries.find(candidate => candidate.id === item.entry);
        const row = document.createElement('tr');
        const tool = document.createElement('th');
        const link = document.createElement('a');
        link.href = entry?.detailPath || `catalog/index.html#${item.entry}`;
        link.textContent = entry?.title || item.entry;
        tool.appendChild(link);
        row.appendChild(tool);
        row.appendChild(el('td', '', `${item.score}/5`));
        row.appendChild(el('td', '', text(item.evidence, lang)));
        tbody.appendChild(row);
      });
      table.append(thead, tbody);
      tableWrap.appendChild(table);
      article.appendChild(tableWrap);
      rankings.appendChild(article);
    });
  }

  function renderMethodology(data, lang) {
    const ui = UI[lang] || UI.en;
    const methodology = document.getElementById('methodology-list');
    methodology.replaceChildren();
    const rubric = el('article', 'cookbook-methodology-block');
    rubric.appendChild(el('h3', '', ui.labels.rubric));
    const rubricList = el('dl', 'cookbook-methodology-rubric');
    data.methodology.rubric.forEach(item => {
      rubricList.appendChild(el('dt', '', text(item.title, lang)));
      rubricList.appendChild(el('dd', '', text(item.description, lang)));
    });
    rubric.appendChild(rubricList);
    const cadence = el('article', 'cookbook-methodology-block');
    cadence.appendChild(el('h3', '', ui.labels.cadence));
    const cadenceList = el('ul', '');
    data.methodology.reviewCadence.forEach(item => {
      const li = el('li', '');
      li.append(el('strong', '', text(item.scope, lang)), document.createTextNode(' — ' + text(item.rule, lang)));
      cadenceList.appendChild(li);
    });
    cadence.appendChild(cadenceList);
    methodology.append(rubric, cadence);
  }

  function renderRoadmap(data, lang) {
    const list = document.getElementById('roadmap-list');
    list.replaceChildren();
    data.roadmap.forEach(item => {
      const li = el('li', '');
      li.append(el('strong', '', text(item.title, lang)), document.createTextNode(' — ' + text(item.description, lang)));
      list.appendChild(li);
    });
  }

  function render(data, lang) {
    applyStaticText(lang);
    renderHub(lang);
    renderMap(data, lang);
    renderRecipes(data, lang);
    renderRankings(data, lang);
    renderMethodology(data, lang);
    renderRoadmap(data, lang);
  }

  fetch('data.json')
    .then(response => response.json())
    .then(data => {
      let lang = getLang();
      const select = document.getElementById('lang-select');
      select.value = lang;
      render(data, lang);
      select.addEventListener('change', () => {
        lang = select.value;
        localStorage.setItem('lang', lang);
        const url = new URL(window.location);
        url.searchParams.set('lang', lang);
        history.replaceState(null, '', url);
        render(data, lang);
      });
    });

  (function() {
    const body = document.body;
    const saved = localStorage.getItem('theme');
    if (saved) { body.className = saved; }
    (function(){ var m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = body.classList.contains('dark-theme') ? '#1a1a1a' : '#ffffff'; })();
    const btn = document.querySelector('.theme-button');
    if (btn) btn.onclick = function() {
      const dark = body.classList.contains('dark-theme');
      body.classList.toggle('light-theme', dark);
      body.classList.toggle('dark-theme', !dark);
      localStorage.setItem('theme', body.className);
      var m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = !dark ? '#1a1a1a' : '#ffffff';
    };

    // With no explicit choice the site follows the device setting as it changes.
    if (window.matchMedia) {
      matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
        var chosen = null;
        try { chosen = localStorage.getItem('theme'); } catch (err) {}
        if (chosen === 'dark-theme' || chosen === 'light-theme') return;
        body.className = e.matches ? 'dark-theme' : 'light-theme';
        (function(){var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=e.matches?'#1a1a1a':'#ffffff';})();
      });
    }
  })();
  </script>
</body>
